name: HUMANO website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'resources/branding/**'
      - 'resources/images/**'
      - 'resources/illustrations/**'
      - 'resources/ood/**'
      - 'resources/videos/**'
      - 'resources/data/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v4
        if: github.repository == 'Symbiosis-Robotics/HUMANO' && github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    if: github.repository == 'Symbiosis-Robotics/HUMANO' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
