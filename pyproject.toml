[project]
name = "humano"
version = "0.1.0"
description = "**A Large-Scale Benchmark for Generalist Humanoid Loco-Manipulation"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "albumentations==1.4.18",
    "dm-control==1.0.21",
    "diffusers==0.37.1",
    "gymnasium>0.29.1",
    "isaacsim[all,extscache]==4.5.0",
    "mujoco==3.3.6",
    "numpy==1.26.4",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "python-dotenv>=0.9.9",
    "python-fcl>=0.7.0.8",
    "pyzmq>=26.0",
    "requests>=2.31",
    "rich>=13.9.4",
    "safetensors>=0.6.2",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.57.3",
    "transforms3d>=0.4.2",
    "trimesh>=4.7.1",
    "typer-slim>=0.17.3",
    "tyro>=0.8",
    "warp-lang==1.7.0",
    "nvidia-curobo[isaacsim]",
    "onnxruntime-gpu==1.17.1; sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
    "gear_sonic[sim]",
    "unitree-sdk2py",
    "decoupled_wbc[full]",
    "lerobot",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humano = ["resources.json"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[[tool.uv.index]]
name = "onnxruntime-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit==4.6.2",
    "pytest>=8.4.1",
    "ruff==0.15.16",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
nvidia-curobo = { path = "third_party/curobo", editable = true }
gear_sonic = { path = "third_party/gear_sonic", editable = true }
unitree-sdk2py = { path = "third_party/unitree_sdk2_python", editable = true }
decoupled_wbc = { path = "third_party/decoupled_wbc", editable = true }
lerobot = { git = "https://github.com/songlin/lerobot.git", rev = "09929d8057b044b53aecaf5c6d7eb71f99e8beb9" }
onnxruntime-gpu = { index = "onnxruntime-cuda-12" }

[project.scripts]
humano-eval = "humano.cli.eval_task:typer_main"
humano-postprocess-dataset = "humano.cli.postprocess_dataset:typer_main"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py310"
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "F401",   # unused import (common during development)
    "E402",   # import not at top of file (common in scripts)
    "F541",   # f-string without placeholders (low value)
    "E501",   # line too long (formatter handles this)
    "F841",   # unused local variable (common during debugging)
    "ARG001", # unused function argument (common in interfaces/callbacks)
    "ARG002", # unused method argument (common in class methods/callbacks)
    "ANN001", # missing function argument type annotation
    "ANN201", # missing public function return type annotation
    "D100",   # missing module docstring
    "D101",   # missing class docstring
    "D102",   # missing method docstring
    "D103",   # missing function docstring
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["humano"]
