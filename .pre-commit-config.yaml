exclude: '(^third_party/|^baselines/|.*\.(md|rst)$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
        files: '^(src/humano/|scripts/|tests/).*\.pyi?$'
        types_or: [python, pyi]
      - id: ruff-format
        files: '^(src/humano/|scripts/|tests/).*\.pyi?$'
        types_or: [python, pyi]
